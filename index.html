<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eden Logs - Portal de Webhooks</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></link>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        eden: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                            900: '#7c2d12',
                            dark: '#0f0f10',
                            card: '#18181b',
                            border: '#27272a'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-eden-dark text-gray-100 min-h-screen font-sans antialiased">

    <!-- Configuração do Firebase com os teus dados -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBF0dpYF-jgGsHhmuPPZWezFPpqiFcthkc",
            authDomain: "edenrplogs.firebaseapp.com",
            projectId: "edenrplogs",
            storageBucket: "edenrplogs.firebasestorage.app",
            messagingSenderId: "1060773736396",
            appId: "1:1060773736396:web:265d4fb6911509d7c1f769",
            measurementId: "G-Q4T277CNWL"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>

    <!-- App Container -->
    <div id="app" class="min-h-screen flex flex-col">
        <!-- O conteúdo será injetado pelo JavaScript -->
    </div>

    <script>
        let currentUser = JSON.parse(localStorage.getItem('eden_current_user')) || null;
        const ADMIN_USER = { username: "MelgaCfg", role: "admin", name: "Administrador" };

        function renderApp() {
            const app = document.getElementById('app');
            if (!currentUser) {
                app.innerHTML = renderLoginScreen();
            } else {
                app.innerHTML = renderDashboard();
                initRealtimeSync();
            }
        }

        function renderLoginScreen() {
            return `
                <div class="flex-1 flex items-center justify-center p-4">
                    <div class="bg-eden-card border border-eden-border rounded-2xl p-8 max-w-md w-full shadow-2xl">
                        <div class="text-center mb-8">
                            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-eden-500/10 text-eden-500 mb-4 text-2xl">
                                <i class="fa-solid fa-shield-halved"></i>
                            </div>
                            <h1 class="text-2xl font-bold tracking-tight text-white">Eden Logs</h1>
                            <p class="text-sm text-gray-400 mt-1">Insira as suas credenciais para aceder ao portal</p>
                        </div>
                        <form onsubmit="handleLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Utilizador</label>
                                <input type="text" id="loginUser" required class="w-full bg-eden-dark border border-eden-border rounded-xl px-4 py-3 text-white focus:outline-none focus:border-eden-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Palavra-passe</label>
                                <input type="password" id="loginPass" required class="w-full bg-eden-dark border border-eden-border rounded-xl px-4 py-3 text-white focus:outline-none focus:border-eden-500">
                            </div>
                            <button type="submit" class="w-full bg-eden-600 hover:bg-eden-500 text-white font-semibold py-3 rounded-xl transition duration-200 shadow-lg shadow-eden-600/20">
                                Entrar no Portal
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUser').value;
            const p = document.getElementById('loginPass').value;

            if (u === "MelgaCfg" && p === "melgacfgedenconfig") {
                currentUser = ADMIN_USER;
                localStorage.setItem('eden_current_user', JSON.stringify(currentUser));
                renderApp();
            } else {
                db.collection("users").where("username", "==", u).get().then((querySnapshot) => {
                    let found = false;
                    querySnapshot.forEach((doc) => {
                        const data = doc.data();
                        if (data.password === p) {
                            found = true;
                            currentUser = { username: data.username, role: data.role, name: data.name };
                            localStorage.setItem('eden_current_user', JSON.stringify(currentUser));
                            renderApp();
                        }
                    });
                    if (!found) alert("Credenciais inválidas!");
                });
            }
        }

        function renderDashboard() {
            return `
                <div class="flex h-screen overflow-hidden">
                    <aside class="w-72 bg-eden-card border-r border-eden-border flex flex-col">
                        <div class="p-5 border-b border-eden-border flex items-center justify-between">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 rounded-xl bg-eden-500/20 flex items-center justify-center text-eden-500 font-bold">
                                    <i class="fa-solid fa-cube"></i>
                                </div>
                                <span class="font-bold text-lg text-white">Eden Logs</span>
                            </div>
                            <button onclick="logout()" title="Terminar Sessão" class="text-gray-400 hover:text-red-400 transition"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
                        </div>
                        <div id="sidebar-rooms" class="flex-1 overflow-y-auto p-4 space-y-2">
                            <p class="text-xs text-gray-500">A carregar salas da nuvem...</p>
                        </div>
                        ${currentUser.role === 'admin' ? `
                            <div class="p-4 border-t border-eden-border">
                                <button onclick="openAdminModal()" class="w-full bg-eden-600/20 hover:bg-eden-600/30 text-eden-500 text-sm font-semibold py-2.5 rounded-xl transition border border-eden-500/30">
                                    <i class="fa-solid fa-gear mr-2"></i> Painel de Admin
                                </button>
                            </div>
                        ` : ''}
                    </aside>
                    <main id="main-content" class="flex-1 flex flex-col bg-eden-dark overflow-y-auto p-8">
                        <div class="max-w-2xl mx-auto text-center mt-20">
                            <h2 class="text-2xl font-bold mb-2">Bem-vindo ao Eden Logs</h2>
                            <p class="text-gray-400">Selecione uma sala ao lado para ver os registos sincronizados em tempo real.</p>
                        </div>
                    </main>
                </div>
                <div id="modal-container"></div>
            `;
        }

        function initRealtimeSync() {
            db.collection("rooms").onSnapshot((snapshot) => {
                const container = document.getElementById('sidebar-rooms');
                if(!container) return;
                let html = '<h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Salas</h3>';
                if (snapshot.empty) {
                    html += '<p class="text-xs text-gray-500 italic">Nenhuma sala criada ainda.</p>';
                }
                snapshot.forEach((doc) => {
                    const room = doc.data();
                    html += `
                        <div onclick="selectRoom('${doc.id}', '${room.name}')" class="p-3 bg-eden-dark border border-eden-border rounded-xl cursor-pointer hover:border-eden-500 transition flex items-center justify-between">
                            <span class="font-semibold text-white text-sm"><i class="fa-solid fa-hashtag mr-2 text-eden-500"></i>${room.name}</span>
                        </div>
                    `;
                });
                container.innerHTML = html;
            });
        }

        function selectRoom(roomId, roomName) {
            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="flex items-center justify-between pb-4 border-b border-eden-border mb-6">
                    <div>
                        <h2 class="text-xl font-bold text-white"><i class="fa-solid fa-hashtag text-eden-500 mr-2"></i>${roomName}</h2>
                        <p class="text-xs text-gray-400">Registo de mensagens e webhooks em tempo real</p>
                    </div>
                </div>
                <div id="room-messages" class="space-y-3 flex-1 overflow-y-auto pr-2">
                    <p class="text-sm text-gray-500 italic">A carregar mensagens...</p>
                </div>
            `;

            db.collection("rooms").doc(roomId).collection("messages").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
                const msgContainer = document.getElementById('room-messages');
                if (!msgContainer) return;
                if (snapshot.empty) {
                    msgContainer.innerHTML = '<p class="text-sm text-gray-500 italic">Ainda não existem mensagens nesta sala.</p>';
                    return;
                }
                let mHtml = '';
                snapshot.forEach((doc) => {
                    const m = doc.data();
                    mHtml += `
                        <div class="bg-eden-card border border-eden-border p-4 rounded-xl">
                            <div class="flex items-center justify-between mb-1">
                                <span class="text-xs font-bold text-eden-500">${m.author || 'Webhook'}</span>
                                <span class="text-[10px] text-gray-500">${new Date(m.timestamp?.toDate ? m.timestamp.toDate() : m.timestamp).toLocaleString()}</span>
                            </div>
                            <p class="text-sm text-gray-200">${m.message}</p>
                        </div>
                    `;
                });
                msgContainer.innerHTML = mHtml;
            });
        }

        function openAdminModal() {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                    <div class="bg-eden-card border border-eden-border rounded-2xl p-6 max-w-lg w-full shadow-2xl">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-lg font-bold text-white">Criar Nova Sala</h3>
                            <button onclick="closeModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <form onsubmit="createRoom(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Nome da Sala</label>
                                <input type="text" id="newRoomName" required class="w-full bg-eden-dark border border-eden-border rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-eden-500">
                            </div>
                            <button type="submit" class="w-full bg-eden-600 hover:bg-eden-500 text-white font-semibold py-2.5 rounded-xl transition">Criar Sala na Nuvem</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function closeModal() {
            document.getElementById('modal-container').innerHTML = '';
        }

        function createRoom(e) {
            e.preventDefault();
            const name = document.getElementById('newRoomName').value;
            db.collection("rooms").add({
                name: name,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                closeModal();
            }).catch((err) => {
                alert("Erro ao criar sala: " + err.message);
            });
        }

        function logout() {
            localStorage.removeItem('eden_current_user');
            currentUser = null;
            renderApp();
        }

        window.onload = renderApp;
    </script>
</body>
</html>
